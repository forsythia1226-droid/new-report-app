name: 48시간 보관 정책 정리

# 아무도 앱에 접속하지 않아도 정해진 시각에 만료 데이터를 삭제한다.
on:
  schedule:
    # UTC 기준. 매시 정각 = KST 매시 정각 (분 단위는 동일)
    - cron: "0 * * * *"
  workflow_dispatch: # 수동 실행 버튼

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install gspread google-auth python-dotenv

      - name: 만료 데이터 삭제
        env:
          # 저장소 Settings > Secrets and variables > Actions 에 등록
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ISSUE_SHEET_ID: ${{ secrets.ISSUE_SHEET_ID }}
          RETENTION_HOURS: "48"
        run: python purge_job.py
